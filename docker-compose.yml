# Requires the shared infra stack to be running first:
#   cd ../infra && docker-compose up -d

services:
  # ─── Celery worker (local dev parity with production) ─────────────────────
  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=debug --concurrency=2
    env_file: ./apps/api/.env
    environment:
      - REDIS_URL=redis://dev_redis:6379/0
    volumes:
      - ./apps/api:/app
    networks:
      - dev_infra

  # ─── Celery beat (scheduled tasks — one process only) ─────────────────────
  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=debug
    env_file: ./apps/api/.env
    environment:
      - REDIS_URL=redis://dev_redis:6379/0
    volumes:
      - ./apps/api:/app
    networks:
      - dev_infra

networks:
  dev_infra:
    external: true
