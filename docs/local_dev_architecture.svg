<svg width="800" height="580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">MySitter — Local Development Architecture</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 1: Clients                          -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Browser -->
  <rect x="80" y="50" width="170" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Browser</text>
  <text x="165" y="97" text-anchor="middle" font-size="11" fill="#1e40af">localhost:5173</text>

  <!-- Phone -->
  <rect x="550" y="50" width="170" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="635" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Android Phone</text>
  <text x="635" y="97" text-anchor="middle" font-size="11" fill="#1e40af">Expo Go app</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 2: App Servers                      -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Vite -->
  <rect x="80" y="175" width="170" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="165" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Vite Dev Server</text>
  <text x="165" y="219" text-anchor="middle" font-size="11" fill="#15803d">apps/web  :5173</text>
  <text x="165" y="236" text-anchor="middle" font-size="10" fill="#15803d">React + TanStack Query</text>

  <!-- FastAPI -->
  <rect x="315" y="175" width="170" height="70" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">FastAPI (uvicorn)</text>
  <text x="400" y="219" text-anchor="middle" font-size="11" fill="#c2410c">apps/api  :8000</text>
  <text x="400" y="236" text-anchor="middle" font-size="10" fill="#c2410c">/docs · /redoc</text>

  <!-- Expo -->
  <rect x="550" y="175" width="170" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="635" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Expo Dev Server</text>
  <text x="635" y="219" text-anchor="middle" font-size="11" fill="#15803d">apps/mobile  :8081</text>
  <text x="635" y="236" text-anchor="middle" font-size="10" fill="#15803d">React Native</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 3: Docker Container                 -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Docker bounding box -->
  <rect x="30" y="305" width="740" height="250" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="30" y="305" width="90" height="22" rx="4" fill="#64748b"/>
  <text x="75" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🐳 Docker</text>

  <!-- Postgres -->
  <rect x="52" y="338" width="165" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="134" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">PostgreSQL 16</text>
  <text x="134" y="378" text-anchor="middle" font-size="11" fill="#6d28d9">+ PostGIS</text>
  <text x="134" y="395" text-anchor="middle" font-size="10" fill="#6d28d9">host:5533 → ctr:5432</text>
  <text x="134" y="410" text-anchor="middle" font-size="10" fill="#6d28d9">vol: postgres_data</text>

  <!-- Redis -->
  <rect x="237" y="338" width="140" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="307" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Redis 7</text>
  <text x="307" y="384" text-anchor="middle" font-size="11" fill="#b91c1c">:6379</text>
  <text x="307" y="401" text-anchor="middle" font-size="10" fill="#b91c1c">cache + task queue</text>

  <!-- Celery Worker -->
  <rect x="397" y="338" width="155" height="80" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="474" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">Celery Worker</text>
  <text x="474" y="379" text-anchor="middle" font-size="11" fill="#854d0e">async tasks</text>
  <text x="474" y="396" text-anchor="middle" font-size="10" fill="#854d0e">(email, SMS, etc.)</text>

  <!-- Celery Beat -->
  <rect x="572" y="338" width="155" height="80" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="649" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">Celery Beat</text>
  <text x="649" y="379" text-anchor="middle" font-size="11" fill="#854d0e">scheduler</text>
  <text x="649" y="396" text-anchor="middle" font-size="10" fill="#854d0e">(cron-style tasks)</text>

  <!-- MailHog -->
  <rect x="237" y="435" width="310" height="100" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
  <text x="392" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#0e7490">MailHog</text>
  <text x="392" y="480" text-anchor="middle" font-size="11" fill="#0e7490">Captures all outbound email in dev</text>
  <text x="392" y="497" text-anchor="middle" font-size="10" fill="#0e7490">SMTP :1025</text>
  <text x="392" y="514" text-anchor="middle" font-size="10" fill="#0e7490">Web UI → http://localhost:8025</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ARROWS                                  -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Browser ↕ Vite (vertical) -->
  <line x1="165" y1="115" x2="165" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

  <!-- Phone ↕ Expo (vertical) -->
  <line x1="635" y1="115" x2="635" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>

  <!-- Vite → FastAPI (horizontal) -->
  <line x1="250" y1="210" x2="315" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="282" y="204" text-anchor="middle" font-size="9" fill="#64748b">HTTP/WS</text>

  <!-- Expo → FastAPI (horizontal) -->
  <line x1="550" y1="210" x2="485" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-rev)"/>
  <text x="517" y="204" text-anchor="middle" font-size="9" fill="#64748b">HTTP/WS</text>

  <!-- FastAPI → Docker services -->
  <line x1="400" y1="245" x2="400" y2="305" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="280" font-size="9" fill="#64748b">SQL · Cache · Queue</text>

</svg>
