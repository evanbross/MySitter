[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime by env.py using DATABASE_SYNC_URL env var
sqlalchemy.url = postgresql://mysitter_user:mysitter@localhost:5533/mysitter_db
#placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
