<svg width="900" height="775" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">MySitter — Hybrid Alpha/Beta Architecture (Home-Hosted)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 1: Clients                          -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Browser -->
  <rect x="28" y="45" width="155" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="106" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Browser</text>
  <text x="106" y="88" text-anchor="middle" font-size="11" fill="#1e40af">mysitter.com</text>
  <text x="106" y="103" text-anchor="middle" font-size="10" fill="#1e40af">React + Vite (Pages)</text>

  <!-- iOS App -->
  <rect x="198" y="45" width="140" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="268" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">iOS / Android</text>
  <text x="268" y="88" text-anchor="middle" font-size="11" fill="#1e40af">Expo Go</text>
  <text x="268" y="103" text-anchor="middle" font-size="10" fill="#1e40af">(alpha — no store)</text>

  <!-- Android App -->
  <rect x="352" y="45" width="140" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="422" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Android App</text>
  <text x="422" y="88" text-anchor="middle" font-size="11" fill="#1e40af">Expo Go</text>
  <text x="422" y="103" text-anchor="middle" font-size="10" fill="#1e40af">(alpha — no store)</text>

  <!-- Admin Panel -->
  <rect x="717" y="45" width="155" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="795" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Admin Panel</text>
  <text x="795" y="88" text-anchor="middle" font-size="11" fill="#1e40af">admin.mysitter.com</text>
  <text x="795" y="103" text-anchor="middle" font-size="10" fill="#1e40af">React Admin</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 2: Cloudflare Edge                  -->
  <!-- ═══════════════════════════════════════ -->

  <rect x="20" y="150" width="860" height="55" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Cloudflare (free tier)</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#c2410c">DNS · CDN · WAF · DDoS · SSL/TLS · Pages (hosts built React app — free)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Home Machine bounding box               -->
  <!-- ═══════════════════════════════════════ -->

  <rect x="20" y="218" width="860" height="307" rx="12" fill="#fafaf9" stroke="#78716c" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="20" y="218" width="185" height="22" rx="4" fill="#78716c"/>
  <text x="112" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🏠 Home Machine</text>

  <!-- cloudflared tunnel agent -->
  <rect x="250" y="241" width="390" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="445" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">cloudflared (Cloudflare Tunnel Agent)</text>
  <text x="445" y="279" text-anchor="middle" font-size="10" fill="#065f46">outbound TLS tunnel — no open ports on router</text>

  <!-- Compute row -->

  <!-- FastAPI -->
  <rect x="68" y="305" width="235" height="72" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="185" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">FastAPI (uvicorn)</text>
  <text x="185" y="344" text-anchor="middle" font-size="11" fill="#c2410c">apps/api  :8000</text>
  <text x="185" y="361" text-anchor="middle" font-size="10" fill="#c2410c">single instance</text>

  <!-- Celery Worker -->
  <rect x="320" y="305" width="225" height="72" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="432" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">Celery Worker</text>
  <text x="432" y="344" text-anchor="middle" font-size="11" fill="#854d0e">async tasks</text>
  <text x="432" y="361" text-anchor="middle" font-size="10" fill="#854d0e">email · SMS · push</text>

  <!-- Celery Beat -->
  <rect x="562" y="305" width="225" height="72" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="674" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">Celery Beat</text>
  <text x="674" y="344" text-anchor="middle" font-size="11" fill="#854d0e">scheduler</text>
  <text x="674" y="361" text-anchor="middle" font-size="10" fill="#854d0e">cron-style tasks</text>

  <!-- Docker sub-box (PG + Redis) -->
  <rect x="38" y="393" width="565" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="38" y="393" width="65" height="20" rx="3" fill="#64748b"/>
  <text x="70" y="407" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">🐳 Docker</text>

  <!-- PostgreSQL -->
  <rect x="52" y="414" width="245" height="78" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="174" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">PostgreSQL 16 + PostGIS</text>
  <text x="174" y="453" text-anchor="middle" font-size="11" fill="#6d28d9">host:5533 → ctr:5432</text>
  <text x="174" y="470" text-anchor="middle" font-size="10" fill="#6d28d9">vol: postgres_data</text>
  <text x="174" y="484" text-anchor="middle" font-size="10" fill="#6d28d9">(same as local dev)</text>

  <!-- Redis -->
  <rect x="312" y="414" width="205" height="78" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="414" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Redis 7</text>
  <text x="414" y="453" text-anchor="middle" font-size="11" fill="#b91c1c">:6379</text>
  <text x="414" y="470" text-anchor="middle" font-size="11" fill="#b91c1c">cache + task queue</text>
  <text x="414" y="484" text-anchor="middle" font-size="10" fill="#b91c1c">(same as local dev)</text>

  <!-- Local Disk (file storage) -->
  <rect x="620" y="393" width="190" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="715" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Local Disk</text>
  <text x="715" y="448" text-anchor="middle" font-size="11" fill="#475569">file uploads</text>
  <text x="715" y="465" text-anchor="middle" font-size="11" fill="#475569">avatars</text>
  <text x="715" y="482" text-anchor="middle" font-size="10" fill="#475569">(no DO Spaces needed)</text>
  <text x="715" y="496" text-anchor="middle" font-size="10" fill="#94a3b8">→ swap to Spaces for beta</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ROW 5: External Third-Party Services    -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Stripe -->
  <rect x="41" y="545" width="150" height="70" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="116" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Stripe</text>
  <text x="116" y="585" text-anchor="middle" font-size="10" fill="#7e22ce">subscriptions</text>
  <text x="116" y="601" text-anchor="middle" font-size="10" fill="#7e22ce">billing + webhooks</text>

  <!-- Resend -->
  <rect x="208" y="545" width="150" height="70" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
  <text x="283" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#0e7490">Resend</text>
  <text x="283" y="585" text-anchor="middle" font-size="10" fill="#0e7490">transactional email</text>
  <text x="283" y="601" text-anchor="middle" font-size="10" fill="#0e7490">free tier (3k/mo)</text>

  <!-- Twilio -->
  <rect x="375" y="545" width="150" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Twilio</text>
  <text x="450" y="585" text-anchor="middle" font-size="10" fill="#b91c1c">SMS notifications</text>
  <text x="450" y="601" text-anchor="middle" font-size="10" fill="#b91c1c">pay-as-you-go</text>

  <!-- Expo Push -->
  <rect x="542" y="545" width="150" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="617" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Expo Push</text>
  <text x="617" y="585" text-anchor="middle" font-size="10" fill="#1e40af">push notifications</text>
  <text x="617" y="601" text-anchor="middle" font-size="10" fill="#1e40af">APNs + FCM routing</text>

  <!-- Mapbox -->
  <rect x="709" y="545" width="150" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="784" y="568" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Mapbox</text>
  <text x="784" y="585" text-anchor="middle" font-size="10" fill="#15803d">maps + geocoding</text>
  <text x="784" y="601" text-anchor="middle" font-size="10" fill="#15803d">free tier (50k/mo)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ARROWS                                  -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Clients → Cloudflare -->
  <line x1="106" y1="110" x2="106" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="268" y1="110" x2="268" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="422" y1="110" x2="422" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="110" x2="795" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="144" text-anchor="middle" font-size="9" fill="#64748b">HTTPS / WSS</text>

  <!-- Cloudflare → cloudflared (tunnel, outbound direction note) -->
  <line x1="445" y1="205" x2="445" y2="241" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="226" font-size="9" fill="#059669">Tunnel</text>

  <!-- cloudflared → FastAPI (L-shape: down then left) -->
  <line x1="445" y1="289" x2="445" y2="298" stroke="#64748b" stroke-width="1.5"/>
  <line x1="185" y1="298" x2="445" y2="298" stroke="#64748b" stroke-width="1.5"/>
  <line x1="185" y1="298" x2="185" y2="305" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FastAPI → PostgreSQL (near-vertical) -->
  <line x1="185" y1="377" x2="175" y2="414" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Celery Worker → Redis (near-vertical) -->
  <line x1="432" y1="377" x2="414" y2="414" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Home Machine → External Services -->
  <line x1="450" y1="525" x2="450" y2="545" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="538" font-size="9" fill="#64748b">API calls</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Notes: Key Differences                  -->
  <!-- ═══════════════════════════════════════ -->

  <rect x="20" y="633" width="535" height="122" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="287" y="649" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Key Differences from Production</text>
  <text x="34" y="664" font-size="10" fill="#0c4a6e">• No DO Droplets or Load Balancer — Cloudflare Tunnel routes all inbound traffic</text>
  <text x="34" y="677" font-size="10" fill="#0c4a6e">• Single FastAPI instance (no horizontal scaling needed at alpha scale)</text>
  <text x="34" y="690" font-size="10" fill="#0c4a6e">• PostgreSQL + Redis run in Docker — same docker-compose.yml as local dev</text>
  <text x="34" y="703" font-size="10" fill="#0c4a6e">• File uploads stored on local disk; swap to DO Spaces before beta launch</text>
  <text x="34" y="716" font-size="10" fill="#0c4a6e">• React app hosted on Cloudflare Pages (free) — no server needed for static assets</text>
  <text x="34" y="729" font-size="10" fill="#0c4a6e">• Estimated cost: ~$1/mo (domain) + pay-as-you-go third-party API usage</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Notes: Port Summary                     -->
  <!-- ═══════════════════════════════════════ -->

  <rect x="565" y="633" width="315" height="122" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="722" y="649" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Router / Firewall Port Summary</text>
  <text x="579" y="664" font-size="10" fill="#14532d">• API: no inbound ports — cloudflared uses outbound :443</text>
  <text x="579" y="677" font-size="10" fill="#14532d">• Stripe webhooks: routed via Cloudflare Tunnel (no port needed)</text>
  <text x="579" y="690" font-size="10" fill="#14532d">• SSH: port 22 inbound — optional, for remote machine access</text>
  <text x="579" y="703" font-size="10" fill="#14532d">• Expo Go: use npx expo start --tunnel (:8081 stays closed)</text>
  <text x="579" y="716" font-size="10" fill="#dc2626">• NEVER open: :5432 (Postgres) · :6379 (Redis)</text>

</svg>
