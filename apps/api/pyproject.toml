[project]
name = "mysitter-api"
version = "0.1.0"
description = "mysitter pet & house sitting marketplace API"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.15.2",
    "annotated-types==0.7.0",
    "anthropic==0.51.0",
    "anyio==4.13.0",
    "beautifulsoup4==4.13.4",
    "boto3==1.37.38",
    "botocore==1.37.38",
    "certifi==2026.2.25",
    "click==8.3.2",
    "colorama==0.4.6",
    "distro==1.9.0",
    "fastapi==0.115.12",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "jiter==0.13.0",
    "jmespath==1.1.0",
    "mako==1.3.10",
    "markupsafe==3.0.3",
    "pillow==11.2.1",
    "pydantic==2.11.3",
    "pydantic-core==2.33.1",
    "pydantic-settings==2.9.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.0",
    "s3transfer==0.11.5",
    "six==1.17.0",
    "sniffio==1.3.1",
    "soupsieve==2.8.3",
    "sqlalchemy==2.0.40",
    "starlette==0.46.2",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "uvicorn==0.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
